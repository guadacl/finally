# Tradex login theme: Keycloak's classic login pages (login, register, reset password, OTP, errors, social
# first-login...) restyled in the Tradex trading-terminal look. Only CSS and texts are customised, so every
# Keycloak login feature keeps working. Selected per realm with "loginTheme": "finally".
parent=keycloak
import=common/keycloak

# parent CSS first, then the Tradex overrides
styles=css/login.css css/finally.css

# The header logo is not a link to keycloak.org
kcLogoLink=http://localhost:8000/

# Single centered column instead of the wide PatternFly grid
kcContentClass=finally-content
kcFormCardClass=card-pf finally-card
