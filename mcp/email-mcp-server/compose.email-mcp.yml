# Notification MCP server for FinAlly (service name kept as email-mcp; included by the root docker-compose.yml).
#
# The app's Camunda "email-notify" / "sms-notify" workers call this server's send_email / send_sms tools (MCP over
# Streamable HTTP, http://email-mcp:3001/mcp); it relays emails over SMTP and SMS via SMS_PROVIDER (default: log).
# Internal only: no host port (GET /health and GET /sms/outbox are reachable from the compose network only).
# Default SMTP target is the bundled Mailpit (read the emails at http://localhost:8025).
# For a real SMTP server set MAIL_HOST / MAIL_PORT / MAIL_USERNAME / MAIL_PASSWORD / MAIL_STARTTLS in .env.

services:
  email-mcp:
    build:
      context: .
    image: finally-email-mcp:latest
    container_name: finally-email-mcp
    # Only the SMTP settings are passed (interpolated from the root .env); the container never sees the app's
    # other secrets (OpenRouter, Finnhub, Massive, Keycloak).
    environment:
      MCP_PORT: "3001"
      MCP_PATH: /mcp
      MAIL_HOST: ${MAIL_HOST:-mailpit}
      MAIL_PORT: ${MAIL_PORT:-1025}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-FinAlly <alerts@finally.local>}
      MAIL_STARTTLS: ${MAIL_STARTTLS:-false}
      MAIL_SECURE: ${MAIL_SECURE:-}
      # send_sms provider: "log" (default) writes each SMS as one log line (masked number), no real SMS, no cost.
      # Check them with:  docker logs finally-email-mcp | grep "\[sms\]"   or   GET http://email-mcp:3001/sms/outbox
      SMS_PROVIDER: ${SMS_PROVIDER:-log}
    expose:
      - "3001"
    depends_on:
      mailpit:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 5s
    restart: unless-stopped
