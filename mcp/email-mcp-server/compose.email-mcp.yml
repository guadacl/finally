# Email MCP server for FinAlly (included by the root docker-compose.yml).
#
# The app's Camunda "email-notify" worker calls this server's send_email tool (MCP over Streamable HTTP,
# http://email-mcp:3001/mcp); it relays the email over SMTP. Internal only: no host port.
# Default SMTP target is the bundled Mailpit (read the emails at http://localhost:8025).
# For a real SMTP server set MAIL_HOST / MAIL_PORT / MAIL_USERNAME / MAIL_PASSWORD / MAIL_STARTTLS in .env.

services:
  email-mcp:
    build:
      context: .
    image: finally-email-mcp:latest
    container_name: finally-email-mcp
    # Only the SMTP settings are passed (interpolated from the root .env); the container never sees the app's
    # other secrets (OpenRouter, Finnhub, Massive, Keycloak).
    environment:
      MCP_PORT: "3001"
      MCP_PATH: /mcp
      MAIL_HOST: ${MAIL_HOST:-mailpit}
      MAIL_PORT: ${MAIL_PORT:-1025}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-FinAlly <alerts@finally.local>}
      MAIL_STARTTLS: ${MAIL_STARTTLS:-false}
      MAIL_SECURE: ${MAIL_SECURE:-}
    expose:
      - "3001"
    depends_on:
      mailpit:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 5s
    restart: unless-stopped
