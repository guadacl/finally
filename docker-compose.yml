# FinAlly — full stack: app + postgres + camunda
#   docker compose up -d --build      start everything (http://localhost:8000)
#   docker compose down               stop (volumes / data are kept)
#
# Infrastructure services live in included files so each build agent owns its own service:
#   db/compose.postgres.yml       -> service `postgres`  (DB agent)
#   camunda/compose.camunda.yml   -> service `camunda`   (Camunda agent)

name: finally

include:
  - db/compose.postgres.yml
  - camunda/compose.camunda.yml
  - keycloak/compose.keycloak.yml

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: finally-app:latest
    container_name: finally-app
    env_file:
      - path: .env
        required: false
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-finally}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-finally}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-finally}
      CAMUNDA_GRPC_ADDRESS: http://camunda:26500
      CAMUNDA_REST_ADDRESS: http://camunda:8080
      FINALLY_WORKFLOW_ENABLED: ${FINALLY_WORKFLOW_ENABLED:-true}
      # Keycloak login: browser-facing URL vs. container-to-container URL
      KEYCLOAK_URL: http://localhost:${KEYCLOAK_HOST_PORT:-8180}
      KEYCLOAK_INTERNAL_URL: http://keycloak:8080
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET:-finally-dev-secret}
    ports:
      - "${APP_PORT:-8000}:8000"   # set APP_PORT in .env if 8000 is taken on the host
    depends_on:
      postgres:
        condition: service_healthy
      camunda:
        condition: service_healthy
      # the app starts without Keycloak (no discovery at boot); logins work once Keycloak is up
      keycloak:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    restart: unless-stopped
